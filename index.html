<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice</title>
    <link rel="stylesheet" href="style3_HW.css">
</head>
<body>

<div class="invoice">

    <h1>INVOICE</h1>

    <div class="invoice-number">
        #INV-1007-007
    </div>

    <div class="line"></div>

    <div class="info">

        <div class="info-box">
            <b>From:</b> BELTEI STORE<br>
            Hometra
        </div>

        <div class="info-box">
            <b>To:</b> Hout<br>
            Phnom Penh
        </div>

    </div>

    <div class="date">
        <b>Date:</b> 07 july 2027
    </div>

    <table>

        <tr>
            <th>Item</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Total</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>1</td>
            <td>$770.00</td>
            <td>$770.00</td>
        </tr>

        <tr>
            <td>Mouse</td>
            <td>1</td>
            <td>$10.00</td>
            <td>$10.00</td>
        </tr>

        <tr>
            <td>Keyboard</td>
            <td>1</td>
            <td>$70.00</td>
            <td>$70.00</td>
        </tr>

    </table>

    <div class="summary">
        <div>Subtotal: $850.00</div>
        <div>Tax: $77.00</div>
        <div class="total">TOTAL: $927.00</div>
        <div class="paid">PAID</div>
    </div>

</div>

</body>
</html>
